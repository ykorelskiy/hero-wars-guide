<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стронгфордская Викторина - Hero Wars</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📚 Стронгфордская Викторина</h1>
            <p>Гайд и ответы на вопросы Dominion Era</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Введите ключевое слово из вопроса (например: Астарот)...">
        </div>

        <div id="quizContainer" class="quiz-list">
            <!-- Вопросы будут генерироваться через JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
